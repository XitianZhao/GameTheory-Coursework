<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simplex Defender Best Response Diagram</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
  body { font-family: Arial, sans-serif; }
  .controls { margin: 10px 0; }
  .controls label { margin-right: 20px; font-size: 18px; }
</style>

</head>
<body>

<h2>Projected Simplex Defender Best Response Diagram</h2>

<!-- Sliders -->
<div class="controls">
  <label>
    s: <input type="range" id="sSlider" min="0" max="1" step="0.01" value="0.9" style="width:300px;">
    <span id="sValue">0.90</span>
  </label>

  <label>
    t: <input type="range" id="tSlider" min="0" max="1" step="0.01" value="0.1" style="width:300px;">
    <span id="tValue">0.10</span>
  </label>
</div>

<div id="plot" style="width:850px; height:850px;"></div>

<script>

let theta = 30.0 / 360.0 * 2.0 * Math.PI;
let proj = [
  [-Math.cos(theta),  Math.cos(theta), 0],
  [-Math.sin(theta), -Math.sin(theta), 1]
];

function projectPoint(p) {
  return [
    proj[0][0]*p[0] + proj[0][1]*p[1] + proj[0][2]*p[2],
    proj[1][0]*p[0] + proj[1][1]*p[1] + proj[1][2]*p[2]
  ];
}


function payoffBH(p, s, t) {
  let [p0, p1, p2] = p;
  return -(0*p0 + (109+100*s)*p1 + (74-283*t)*p2);
}
function payoffBL(p, s, t) {
  let [p0, p1, p2] = p;
  return -((32+78*s)*p0 + (-27)*p1 + (74-283*t)*p2);
}
function bestResponse(p, s, t) {
  return payoffBH(p, s, t) > payoffBL(p, s, t) ? 1 : 0;
}


function computeBRGrid(s, t) {
  let xs=[], ys=[], cs=[];
  let res = 120;

  for (let i=0; i<=res; i++) {
    let p0 = i/res;
    for (let j=0; j<=res-i; j++) {
      let p1 = j/res;
      let p2 = 1 - p0 - p1;
      let p = [p0,p1,p2];

      let c = bestResponse(p, s, t);
      let [x,y] = projectPoint(p);

      xs.push(x); ys.push(y); cs.push(c);
    }
  }
  return {xs, ys, cs};
}


function computeBoundary(s) {
  let A = 136 + 100*s;
  let B = 32 + 78*s;
  let R = B / A;
  let max_p0 = 1/(1+R);

  let bx=[], by=[];
  for (let p0=0; p0<=max_p0; p0+=0.002) {
    let p1 = R*p0;
    let p2 = 1 - p0 - p1;
    if (p2 >= -1e-9) {
      let [x,y] = projectPoint([p0,p1,p2]);
      bx.push(x); by.push(y);
    }
  }
  return {bx,by};
}


function simplexEdges() {
  let ts = Array.from({length:800}, (_,i)=> i/799);

  function edge(pA, pB) {
    let ex=[], ey=[];
    for (let t of ts) {
      let p = [
        (1-t)*pA[0] + t*pB[0],
        (1-t)*pA[1] + t*pB[1],
        (1-t)*pA[2] + t*pB[2]
      ];
      let [x,y] = projectPoint(p);
      ex.push(x); ey.push(y);
    }
    return {ex,ey};
  }

  return {
    e12: edge([1,0,0],[0,1,0]),
    e23: edge([0,1,0],[0,0,1]),
    e31: edge([1,0,0],[0,0,1])
  };
}

let edges = simplexEdges();


let p_BL = [0.10, 0.80, 0.10];  
let p_BH = [0.80, 0.10, 0.10];

let [xBL_fix, yBL_fix] = projectPoint(p_BL);
let [xBH_fix, yBH_fix] = projectPoint(p_BH);


function updatePlot() {

  let s = parseFloat(document.getElementById("sSlider").value);
  let t = parseFloat(document.getElementById("tSlider").value);

  document.getElementById("sValue").innerHTML = s.toFixed(2);
  document.getElementById("tValue").innerHTML = t.toFixed(2);

  let {xs, ys, cs} = computeBRGrid(s, t);

  let {bx, by} = computeBoundary(s);

  // Intersection with base edge
  let R = (32+78*s)/(136+100*s);
  let p0 = 1/(1+R);
  let p1 = R*p0;
  let p2 = 0;
  let [ix,iy] = projectPoint([p0,p1,p2]);


  let data = [

    // 1. Shaded BR regions
    {
      x: xs, y: ys, mode: "markers",
      marker: {color: cs, colorscale: "Greys", size: 6},
      type: "scatter",
      showlegend: false
    },

    // 2. Boundary curve
    {
      x: bx, y: by,
      mode: "lines",
      line: {color:"red", width:3},
      showlegend: false
    },

    // 3. Intersection point
    {
      x: [ix], y: [iy],
      mode: "markers+text",
      marker: {color:"red", size:10},
      text: [`(${p0.toFixed(2)},${p1.toFixed(2)},${p2.toFixed(2)})`],
      textposition: "top center",
      showlegend: false
    },

    // 4. FIXED BH label (like plt.text(xBH, yBH, ...))
    {
      x: [xBH_fix], y: [yBH_fix],
      mode: "text",
      text: ["BH best response"],
      textfont: {color:"red", size:22, family:"Arial Black"},
      showlegend: false
    },

    // 5. FIXED BL label
    {
      x: [xBL_fix], y: [yBL_fix],
      mode: "text",
      text: ["BL best response"],
      textfont: {color:"red", size:22, family:"Arial Black"},
      showlegend: false
    },

    // 6. Triangle boundary
    {x: edges.e12.ex, y: edges.e12.ey, mode:"lines", line:{color:"black"}},
    {x: edges.e23.ex, y: edges.e23.ey, mode:"lines", line:{color:"black"}},
    {x: edges.e31.ex, y: edges.e31.ey, mode:"lines", line:{color:"black"}}
  ];

  let layout = {
    xaxis:{visible:false},
    yaxis:{visible:false},
    width:850, height:850,
    showlegend:false
  };

  Plotly.react("plot", data, layout);
}


updatePlot();
document.getElementById("sSlider").addEventListener("input", updatePlot);
document.getElementById("tSlider").addEventListener("input", updatePlot);

</script>

</body>
</html>
